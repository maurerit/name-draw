spring:
  datasource:
    url: jdbc:h2:mem:namedraw-dev
    username: sa
    password: ""
  
  h2:
    console:
      enabled: true
      settings:
        trace: true
        web-allow-others: true
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  flyway:
    enabled: true
    clean-disabled: false
    baseline-on-migrate: true

jwt:
  secret: dev-jwt-secret-key-for-development-only-not-secure
  expiration: 86400000

logging:
  level:
    com.namedraw: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data.jpa: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
